<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
    <title>Page Not Found – Andrew Kramer</title>
    <script>
        // Theme bootstrap: runs before first paint to avoid a flash. Applies the
        // stored choice, falling back to the OS color-scheme preference.
        (function () {
            var stored = null;
            try { stored = localStorage.getItem("theme"); } catch (e) {}
            var dark = stored === "dark" ||
                (stored === null && window.matchMedia("(prefers-color-scheme: dark)").matches);
            document.documentElement.classList.toggle("dark", dark);
        })();
    </script>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Tailwind dark-mode strategy: must be set AFTER the CDN script (the
        // Play CDN defines the `tailwind` object at load; setting it before is
        // silently overwritten). This is the documented CDN pattern and raises
        // no ReferenceError.
        tailwind.config = { darkMode: "class" };
    </script>
</head>

<body class="bg-white dark:bg-gray-900 text-gray-900 dark:text-gray-100">
    <a class="skip-link" href="#main">Skip to main content</a>

    <main class="container mx-auto p-8 text-center" id="main" tabindex="-1" style="min-height: 60vh; display: flex; flex-direction: column; justify-content: center;">
        <h1 class="text-6xl font-bold mb-4">404</h1>
        <h2 class="text-2xl mb-4">Page not found</h2>
        <p class="text-lg mb-8">Sorry — that page doesn't exist (or moved during the recent redesign).</p>
        <div>
            <a href="index.html" class="inline-block bg-gray-700 hover:bg-gray-600 text-white font-semibold px-6 py-3 rounded">Back to home</a>
            <button class="theme-toggle" onclick="toggleTheme()" style="margin-left: 1rem;">
                Toggle Dark Mode
            </button>
        </div>
    </main>

    <script src="theme.js"></script>
</body>
</html>
